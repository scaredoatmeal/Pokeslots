<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PokéSlots Casino</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee+Inline&family=Bungee&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#FFD700;--gold2:#FFA500;--neon-b:#00e5ff;--neon-g:#39ff14;--neon-p:#ff00ff;--red:#cc0000}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100vh;background:#06060d;font-family:'Rajdhani',sans-serif;color:#fff;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 80% 50% at 50% 0%,#1a082e 0%,transparent 65%),
             radial-gradient(ellipse 50% 40% at 80% 90%,#1a0808 0%,transparent 55%),
             repeating-linear-gradient(90deg,transparent,transparent 60px,rgba(255,255,255,.012) 60px,rgba(255,255,255,.012) 61px),
             repeating-linear-gradient(0deg,transparent,transparent 60px,rgba(255,255,255,.012) 60px,rgba(255,255,255,.012) 61px)}
#app{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;padding:20px 12px 60px;gap:18px;min-height:100vh}
header{text-align:center}
h1{font-family:'Bungee Inline',cursive;font-size:clamp(2rem,6vw,4rem);
  background:linear-gradient(135deg,var(--gold),var(--gold2) 40%,#fff 55%,var(--gold));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 18px rgba(255,200,0,.45));line-height:1}
.sub{font-family:'Bungee',cursive;font-size:clamp(.65rem,2vw,.9rem);letter-spacing:6px;color:var(--neon-b);text-shadow:0 0 10px var(--neon-b);margin-top:3px}
.marquee-wrap{width:min(680px,100%);overflow:hidden;background:#0b0b16;border:2px solid var(--gold);border-radius:5px;padding:4px 0;box-shadow:0 0 12px rgba(255,200,0,.25)}
.marquee{display:inline-block;white-space:nowrap;animation:mar 18s linear infinite;font-family:'Bungee',cursive;font-size:.72rem;letter-spacing:2px;color:var(--gold)}
@keyframes mar{from{transform:translateX(100%)}to{transform:translateX(-100%)}}
.machine{width:min(680px,100%);background:linear-gradient(180deg,#191926,#0d0d1a);border:3px solid #28284a;border-radius:22px 22px 28px 28px;
  box-shadow:0 0 0 1px #333,0 0 50px rgba(0,180,255,.07),0 30px 70px rgba(0,0,0,.85);position:relative;overflow:visible}
.machine::before{content:'';position:absolute;top:-4px;left:8%;right:8%;height:4px;background:linear-gradient(90deg,transparent,#c8d8f8,transparent);border-radius:4px}
.sign{background:linear-gradient(180deg,#1a0000,#280000);border-radius:18px 18px 0 0;padding:12px 18px 10px;border-bottom:3px solid var(--gold);display:flex;justify-content:space-between;align-items:center;position:relative}
.sign-lights{display:flex;gap:5px}
.sl{width:10px;height:10px;border-radius:50%;animation:blink 1s infinite}
.sl:nth-child(1){background:#f33;box-shadow:0 0 7px #f33;animation-delay:.0s}
.sl:nth-child(2){background:var(--gold);box-shadow:0 0 7px var(--gold);animation-delay:.2s}
.sl:nth-child(3){background:#3f3;box-shadow:0 0 7px #3f3;animation-delay:.4s}
.sl:nth-child(4){background:var(--neon-b);box-shadow:0 0 7px var(--neon-b);animation-delay:.6s}
.sl:nth-child(5){background:var(--neon-p);box-shadow:0 0 7px var(--neon-p);animation-delay:.8s}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
.sign-title{font-family:'Bungee Inline',cursive;font-size:1.25rem;letter-spacing:2px;color:var(--gold);text-shadow:0 0 14px var(--gold)}
.sound-btn{position:absolute;top:50%;right:14px;transform:translateY(-50%);background:none;border:1px solid #333;border-radius:7px;color:#445;font-size:.68rem;padding:3px 7px;cursor:pointer;font-family:'Bungee',cursive;letter-spacing:1px;transition:all .2s}
.sound-btn:hover{border-color:#666;color:#888}
.sound-btn.on{border-color:var(--neon-b);color:var(--neon-b);box-shadow:0 0 8px rgba(0,229,255,.2)}
.stats{padding:12px 20px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;border-bottom:2px solid #1c1c2e}
.stat{background:#07070f;border:1px solid #232336;border-radius:9px;padding:8px 10px;text-align:center;position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--sc,var(--gold))}
.stat[data-c=b]{--sc:var(--neon-b)} .stat[data-c=g]{--sc:var(--neon-g)}
.slbl{font-size:.6rem;letter-spacing:2px;text-transform:uppercase;color:#667;font-weight:700}
.sval{font-family:'Bungee',cursive;font-size:1.4rem;color:var(--gold);text-shadow:0 0 10px rgba(255,200,0,.4);line-height:1.15}
.sval.b{color:var(--neon-b);text-shadow:0 0 10px rgba(0,229,255,.4)}
.sval.g{color:var(--neon-g);text-shadow:0 0 10px rgba(57,255,20,.4)}

.streak-bar{display:flex;align-items:center;gap:8px;padding:5px 20px;background:#080810;border-bottom:2px solid #1c1c2e}
.streak-badge{font-family:'Bungee',cursive;font-size:.72rem;letter-spacing:1px;padding:3px 10px;border-radius:18px;border:1px solid #333;color:#445;transition:all .3s}
.streak-badge.hot{border-color:#ff6600;color:#ff9900;background:rgba(255,100,0,.1);text-shadow:0 0 8px #ff6600}
.streak-badge.fire{border-color:#ff0000;color:#ff4444;background:rgba(255,0,0,.12);text-shadow:0 0 10px #f30;animation:strk .8s ease-in-out infinite alternate}
@keyframes strk{from{box-shadow:0 0 8px rgba(255,0,0,.3)}to{box-shadow:0 0 20px rgba(255,0,0,.6)}}
.battle-counter{font-family:'Bungee',cursive;font-size:.68rem;letter-spacing:1px;padding:3px 10px;border-radius:18px;border:1px solid #1a2a3a;color:#2a3a4a;transition:all .3s}
.battle-counter.near{border-color:var(--neon-b);color:var(--neon-b);background:rgba(0,229,255,.08);animation:bcPulse 1.2s ease-in-out infinite alternate}
@keyframes bcPulse{from{box-shadow:0 0 4px rgba(0,229,255,.2)}to{box-shadow:0 0 14px rgba(0,229,255,.5)}}
.daily-badge{font-family:'Bungee',cursive;font-size:.68rem;letter-spacing:1px;padding:3px 10px;border-radius:18px;border:1px solid #1a3a1a;color:#2a5a2a;cursor:pointer;transition:all .3s;margin-left:auto}
.daily-badge.ready{border-color:var(--neon-g);color:var(--neon-g);background:rgba(57,255,20,.1);box-shadow:0 0 10px rgba(57,255,20,.25);animation:dailyP 1.5s ease-in-out infinite alternate}
@keyframes dailyP{from{box-shadow:0 0 6px rgba(57,255,20,.2)}to{box-shadow:0 0 18px rgba(57,255,20,.5)}}
.pt-btn{width:100%;background:none;border:none;border-bottom:2px solid #1c1c2e;color:#99a;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:.78rem;letter-spacing:3px;text-transform:uppercase;padding:7px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:color .2s}
.pt-btn:hover{color:var(--gold)} .pt-btn .arr{transition:transform .3s} .pt-btn.open .arr{transform:rotate(180deg)}
.pt-body{display:none;padding:10px 18px;border-bottom:2px solid #1c1c2e;background:rgba(0,0,0,.3)}
.pt-body.vis{display:block}
.pt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px}
.pt-row{display:flex;align-items:center;gap:6px;background:#0a0a16;border:1px solid #1c1c2e;border-radius:7px;padding:5px 9px;font-size:.82rem}
.pt-row .m{font-family:'Bungee',cursive;color:var(--gold);font-size:.95rem;margin-left:auto;white-space:nowrap}
.reels-wrap{padding:18px 20px}
.reels-frame{background:#04040b;border:3px solid #232338;border-radius:14px;padding:14px;box-shadow:inset 0 0 50px rgba(0,0,0,.9),inset 0 0 20px rgba(0,0,20,.5);position:relative}
.reels-frame::before{content:'WIN LINE';position:absolute;right:14px;top:50%;transform:translateY(-50%);font-family:'Bungee',cursive;font-size:.5rem;letter-spacing:2px;color:rgba(255,200,0,.25);z-index:8}
.reels-frame::after{content:'';position:absolute;top:50%;left:12px;right:12px;height:2px;background:linear-gradient(90deg,transparent,rgba(255,200,0,.35),transparent);transform:translateY(-50%);z-index:8;pointer-events:none}
.reels-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.reel-box{height:150px;background:#080812;border:2px solid #1e1e30;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;gap:3px;transition:border-color .3s,box-shadow .3s}
.reel-box::before,.reel-box::after{content:'';position:absolute;left:0;right:0;height:32px;z-index:5;pointer-events:none}
.reel-box::before{top:0;background:linear-gradient(to bottom,rgba(4,4,11,1),transparent)}
.reel-box::after{bottom:0;background:linear-gradient(to top,rgba(4,4,11,1),transparent)}
.reel-box img{width:100px;height:100px;object-fit:contain;filter:drop-shadow(0 0 6px rgba(255,255,255,.12));transition:filter .15s;position:relative;z-index:2}
.reel-name{font-family:'Bungee',cursive;font-size:.55rem;letter-spacing:1px;text-transform:uppercase;color:#667;z-index:2;position:relative}
.reel-box.spinning img{animation:spinBlur .12s linear infinite}
@keyframes spinBlur{0%{filter:blur(4px) brightness(.55)}50%{filter:blur(6px) brightness(.35)}100%{filter:blur(4px) brightness(.55)}}
.reel-box.winner{border-color:var(--gold)!important;animation:winGlow .5s ease-in-out infinite alternate}
@keyframes winGlow{from{box-shadow:0 0 12px var(--gold),inset 0 0 10px rgba(255,200,0,.08)}to{box-shadow:0 0 30px var(--gold),0 0 55px #FF6600,inset 0 0 18px rgba(255,200,0,.15)}}
.reel-box.winner img{animation:winPulse .45s ease-in-out infinite alternate!important;filter:drop-shadow(0 0 14px var(--gold)) brightness(1.25)!important}
@keyframes winPulse{from{transform:scale(1)}to{transform:scale(1.14)}}
/* catch attempt flash — yellow shimmer on reel */
.reel-box.catch-try{border-color:#ffaa00!important;animation:tryGlow .3s ease-in-out 4}
@keyframes tryGlow{0%,100%{box-shadow:none}50%{box-shadow:0 0 20px #ffaa00}}
.msg-bar{text-align:center;padding:8px;height:42px;display:flex;align-items:center;justify-content:center}
.msg{font-family:'Bungee',cursive;font-size:1rem;letter-spacing:2px;color:#444;transition:all .2s}
.msg.win{color:var(--gold);text-shadow:0 0 16px var(--gold),0 0 32px #FF6600;animation:pop .4s cubic-bezier(.36,2,.5,.8)}
.msg.lose{color:#aa2222}
.msg.jackpot{color:var(--neon-b);text-shadow:0 0 18px var(--neon-b),0 0 36px var(--neon-p);font-size:1.2rem;animation:pop .4s cubic-bezier(.36,2,.5,.8)}
.msg.catch{color:var(--neon-g);text-shadow:0 0 16px var(--neon-g);animation:pop .4s cubic-bezier(.36,2,.5,.8)}
.msg.battle{color:var(--neon-b);text-shadow:0 0 16px var(--neon-b);animation:pop .4s cubic-bezier(.36,2,.5,.8)}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
#wflash{position:absolute;inset:0;border-radius:11px;pointer-events:none;z-index:20;opacity:0;background:radial-gradient(ellipse,rgba(255,200,0,.2),transparent 70%);transition:opacity .2s}
#wflash.on{opacity:1;animation:fp .55s ease-in-out infinite alternate}
@keyframes fp{from{opacity:.25}to{opacity:.75}}
.controls{padding:14px 20px 20px;display:flex;flex-direction:column;gap:13px}
.bet-row{display:flex;align-items:center;gap:10px;background:#07070f;border:1px solid #1c1c2e;border-radius:11px;padding:10px 14px}
.bet-lbl{font-size:.68rem;letter-spacing:2px;text-transform:uppercase;color:#557;font-weight:700;width:65px;flex-shrink:0}
.bet-slider{flex:1;-webkit-appearance:none;height:6px;border-radius:3px;outline:none;cursor:pointer;background:linear-gradient(to right,var(--gold) 0%,var(--gold) var(--p,9%),#1e1e1e var(--p,9%),#1e1e1e 100%)}
.bet-slider::-webkit-slider-thumb{-webkit-appearance:none;width:19px;height:19px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold2));cursor:pointer;box-shadow:0 0 7px rgba(255,200,0,.55);border:2px solid rgba(255,255,255,.15)}
.bet-slider::-moz-range-thumb{width:19px;height:19px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold2));cursor:pointer;box-shadow:0 0 7px rgba(255,200,0,.55);border:2px solid rgba(255,255,255,.15)}
.bet-num{font-family:'Bungee',cursive;font-size:1.05rem;color:var(--gold);width:56px;text-align:right;flex-shrink:0}
.qbets{display:flex;gap:5px}
.qb{flex:1;min-width:44px;background:#0e0e18;border:1px solid #262636;border-radius:7px;color:#99a;font-family:'Bungee',cursive;font-size:.72rem;padding:5px 3px;cursor:pointer;transition:all .15s;text-align:center}
.qb:hover{background:#181828;border-color:var(--gold);color:var(--gold)}
.qb.on{background:#181200;border-color:var(--gold);color:var(--gold);box-shadow:0 0 8px rgba(255,200,0,.18)}
.action-row{display:flex;align-items:center;gap:14px}
.spin-btn{flex:1;height:62px;background:linear-gradient(135deg,#c00,#800 50%,#c00);border:none;border-radius:13px;font-family:'Bungee Inline',cursive;font-size:1.55rem;letter-spacing:3px;color:#fff;cursor:pointer;position:relative;overflow:hidden;user-select:none;box-shadow:0 5px 0 #4a0000,0 7px 18px rgba(180,0,0,.35),inset 0 1px 0 rgba(255,255,255,.18);transition:all .1s;text-shadow:0 2px 3px rgba(0,0,0,.45)}
.spin-btn::before{content:'';position:absolute;top:0;left:-100%;width:55%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.13),transparent);transition:left .45s}
.spin-btn:hover::before{left:150%}
.spin-btn:not(:disabled):hover{transform:translateY(-2px);box-shadow:0 7px 0 #4a0000,0 10px 25px rgba(180,0,0,.45),inset 0 1px 0 rgba(255,255,255,.18)}
.spin-btn:not(:disabled):active{transform:translateY(4px);box-shadow:0 1px 0 #4a0000,0 2px 8px rgba(180,0,0,.2)}
.spin-btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important}
.max-btn{width:62px;height:62px;background:linear-gradient(135deg,#001f55,#000f2a);border:2px solid var(--neon-b);border-radius:13px;font-family:'Bungee',cursive;font-size:.68rem;letter-spacing:1px;color:var(--neon-b);cursor:pointer;box-shadow:0 0 10px rgba(0,229,255,.18),0 5px 0 #000;text-shadow:0 0 7px var(--neon-b);transition:all .1s;flex-shrink:0;user-select:none}
.max-btn:hover{background:linear-gradient(135deg,#002d80,#001540);box-shadow:0 0 18px rgba(0,229,255,.35),0 5px 0 #000}

/* ── CATCH OVERLAY ── */
.catch-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:500;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px}
.catch-overlay.show{display:flex;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.pokeball{width:70px;height:70px;border-radius:50%;position:relative;background:linear-gradient(to bottom,#ee1111 0%,#ee1111 47%,#222 47%,#222 53%,#fff 53%,#fff 100%);border:3px solid #1a1a1a;box-shadow:0 0 20px rgba(255,50,50,.5),0 8px 20px rgba(0,0,0,.6)}
.pokeball::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid #1a1a1a;z-index:1}
.pb-shake{animation:pbShake .4s ease-in-out 3}
@keyframes pbShake{0%,100%{transform:rotate(0)}25%{transform:rotate(-18deg)}75%{transform:rotate(18deg)}}
.catch-img{width:130px;height:130px;object-fit:contain;filter:drop-shadow(0 0 22px rgba(57,255,20,.7));animation:catchPop .5s cubic-bezier(.36,2,.5,.8)}
@keyframes catchPop{0%{transform:scale(0) translateY(40px);opacity:0}60%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
.catch-name{font-family:'Bungee Inline',cursive;font-size:2rem;color:var(--neon-g);text-shadow:0 0 20px var(--neon-g),0 0 40px var(--neon-g);letter-spacing:3px}
.catch-label{font-family:'Bungee',cursive;font-size:.85rem;letter-spacing:4px;color:var(--gold);text-shadow:0 0 12px var(--gold)}
.catch-sub{font-family:'Rajdhani',sans-serif;font-size:.85rem;color:#667;letter-spacing:1px}
.ov-dismiss{margin-top:6px;font-family:'Bungee',cursive;font-size:.7rem;letter-spacing:2px;color:#555;cursor:pointer;padding:6px 18px;border:1px solid #333;border-radius:20px;background:none;transition:color .2s,border-color .2s}
.ov-dismiss:hover{color:#888;border-color:#666}

/* ── BATTLE OVERLAY ── */
.battle-overlay{position:fixed;inset:0;background:rgba(0,0,5,.92);z-index:510;display:none;flex-direction:column;align-items:center;justify-content:flex-start;padding:20px 16px 30px;overflow-y:auto}
.battle-overlay.show{display:flex;animation:fadeIn .35s ease}
.battle-title{font-family:'Bungee Inline',cursive;font-size:1.8rem;color:var(--neon-b);text-shadow:0 0 20px var(--neon-b),0 0 40px var(--neon-p);letter-spacing:3px;margin-bottom:4px;text-align:center}
.battle-sub{font-family:'Bungee',cursive;font-size:.72rem;letter-spacing:3px;color:#446;margin-bottom:16px;text-align:center}
.battle-arena{width:100%;max-width:500px;background:#05050f;border:2px solid #1a1a3a;border-radius:16px;padding:20px;margin-bottom:16px;position:relative;overflow:hidden}
.battle-arena::before{content:'VS';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Bungee Inline',cursive;font-size:3rem;color:rgba(255,200,0,.07);letter-spacing:4px}
.battle-fighters{display:flex;justify-content:space-around;align-items:center;gap:10px}
.fighter{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1}
.fighter img{width:90px;height:90px;object-fit:contain;filter:drop-shadow(0 0 10px rgba(255,255,255,.2))}
.fighter .f-name{font-family:'Bungee',cursive;font-size:.6rem;letter-spacing:1px;text-transform:uppercase;color:#667;text-align:center}
.fighter .f-hp-bar{width:100%;height:8px;background:#111;border-radius:4px;overflow:hidden;border:1px solid #222}
.fighter .f-hp-fill{height:100%;border-radius:4px;transition:width .4s ease;background:linear-gradient(90deg,#33cc33,#66ff44)}
.fighter .f-hp-fill.low{background:linear-gradient(90deg,#ff4400,#ff8800)}
.fighter .f-hp-num{font-family:'Bungee',cursive;font-size:.6rem;color:#556}
.fighter.wild img{filter:drop-shadow(0 0 12px rgba(255,50,50,.5))}
.fighter.yours img{filter:drop-shadow(0 0 12px rgba(57,255,20,.4))}
.battle-log{width:100%;max-width:500px;background:#040408;border:1px solid #141428;border-radius:10px;padding:10px 14px;min-height:50px;margin-bottom:14px;font-size:.82rem;color:#556;font-style:italic;line-height:1.6;text-align:center}
.battle-log .bl-line{opacity:0;animation:logFade .3s ease forwards}
@keyframes logFade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.battle-pick-title{font-family:'Bungee',cursive;font-size:.75rem;letter-spacing:3px;color:#667;margin-bottom:10px;text-align:center;width:100%;max-width:500px}
.battle-roster{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:100%;max-width:500px;margin-bottom:14px}
.br-card{background:#09090f;border:2px solid #1e1e2e;border-radius:10px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;transition:all .18s;width:80px}
.br-card:hover{border-color:var(--neon-g);box-shadow:0 0 14px rgba(57,255,20,.25);transform:translateY(-2px)}
.br-card.selected{border-color:var(--neon-g)!important;box-shadow:0 0 18px rgba(57,255,20,.4)!important}
.br-card img{width:52px;height:52px;object-fit:contain}
.br-card .bc-name{font-family:'Bungee',cursive;font-size:.44rem;letter-spacing:1px;text-transform:uppercase;color:#667;text-align:center}
.br-card .bc-type{font-size:.55rem;color:#445;text-align:center}
.br-card .bc-adv{font-size:.6rem;color:var(--neon-g);text-shadow:0 0 6px var(--neon-g)}
.battle-actions{display:flex;gap:10px;width:100%;max-width:500px}
.battle-btn{flex:1;height:48px;border:none;border-radius:11px;font-family:'Bungee',cursive;font-size:.85rem;letter-spacing:2px;cursor:pointer;transition:all .12s;user-select:none}
.battle-btn.fight{background:linear-gradient(135deg,#c00,#800);color:#fff;box-shadow:0 4px 0 #400,0 6px 14px rgba(180,0,0,.3)}
.battle-btn.fight:hover{transform:translateY(-2px);box-shadow:0 6px 0 #400,0 8px 20px rgba(180,0,0,.4)}
.battle-btn.fight:disabled{opacity:.4;cursor:not-allowed;transform:none}
.battle-btn.run{background:#0d0d1a;color:#557;border:2px solid #1e1e30;box-shadow:0 4px 0 #050508}
.battle-btn.run:hover{color:#778;border-color:#2a2a40}
.battle-result{font-family:'Bungee Inline',cursive;font-size:2rem;letter-spacing:3px;text-align:cent
